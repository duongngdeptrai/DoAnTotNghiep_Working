services:
  mongo:
    image: mongo:7
    container_name: child-tracking-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mqtt:
    image: eclipse-mosquitto:2
    container_name: child-tracking-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - ./infra/mosquitto/data:/mosquitto/data
      - ./infra/mosquitto/log:/mosquitto/log

volumes:
  mongo-data:
