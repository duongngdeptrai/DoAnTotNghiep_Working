name: child_tracking_app
description: Real-time child tracking Flutter app with geofence alerts.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Network
  http: ^1.1.0
  web_socket_channel: ^2.4.0

  # State & Storage
  provider: ^6.1.1
  shared_preferences: ^2.2.2

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Utilities
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/